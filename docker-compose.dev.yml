version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: mycrypto-mongodb-dev
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: mycrypto
    volumes:
      - mongodb_data_dev:/data/db
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - mycrypto-network

  # FastAPI Application (Development with hot reload)
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: mycrypto-api-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_TYPE=mongodb
      - DATABASE_NAME=mycrypto
      - MONGODB_URL=mongodb://admin:password123@mongodb:27017/mycrypto?authSource=admin
      - PYTHONPATH=/app
    depends_on:
      - mongodb
    volumes:
      - .:/app
      - /app/__pycache__
    networks:
      - mycrypto-network
    command: ["uvicorn", "main_clean:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # MongoDB Express (Web UI for MongoDB)
  mongo-express:
    image: mongo-express:1.0.0
    container_name: mycrypto-mongo-express-dev
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongodb
    networks:
      - mycrypto-network

volumes:
  mongodb_data_dev:
    driver: local

networks:
  mycrypto-network:
    driver: bridge
